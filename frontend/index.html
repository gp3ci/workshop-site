<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>InstaLite</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="navbar">
        <h2>InstaLite</h2>
    </div>

    <div class="container">
        <!-- Post Creation Card -->
        <form id="post-form" class="card">
            <h3>Create Post</h3>
            <input type="text" id="caption-input" placeholder="Write a caption..." required>
            <input type="text" id="image-input" placeholder="Image URL (e.g. https://picsum.photos/400)" required>
            <button type="submit">Share Post</button>
        </form>

        <!-- Feed Container -->
        <div id="feed"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
